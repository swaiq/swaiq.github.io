        /* ===== طبقة التجميل (CSS) ===== */
        :root {
            --gold: #e7b856;
            --gold-soft: #e8cf8f;
            --ink: #4a2a1f
        }

        html {
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility
        }

        ::selection {
            background: rgba(231, 184, 86, .35)
        }

        /* خلفيات الصفحات الداكنة: توهّج ذهبي هادئ + تعتيم الأطراف */
        .pg:not(#p2)::before {
            content: "";
            position: absolute;
            inset: -10%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 18% 14%, rgba(232, 207, 143, .16), transparent 42%), radial-gradient(circle at 82% 88%, rgba(232, 207, 143, .12), transparent 46%);
            animation: drift 18s ease-in-out infinite alternate
        }

        .pg:not(#p2)::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .32) 100%)
        }

        @keyframes drift {
            from {
                transform: translate3d(-2%, -1%, 0) scale(1)
            }

            to {
                transform: translate3d(2%, 1.5%, 0) scale(1.06)
            }
        }

        /* الإطار الذهبي المزدوج */
        .fr {
            opacity: .6;
            border-width: 1.5px;
            box-shadow: 0 0 44px -14px currentColor, inset 0 0 44px -24px currentColor
        }

        .fr::before {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1px solid currentColor;
            border-radius: 14px;
            opacity: .55
        }

        /* لحظة الظهور الوحيدة: المحتوى يتّضح بنعومة */
        .pg.on .wrap {
            animation: reveal 1.4s cubic-bezier(.2, .7, .2, 1) both
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(14px) scale(.985);
                filter: blur(6px)
            }

            to {
                opacity: 1;
                transform: none;
                filter: none
            }
        }

        /* النصوص */
        #p1 [data-t],
        #p3 [data-t],
        .pg[id^="c"] [data-t] {
            text-shadow: 0 2px 20px rgba(0, 0, 0, .35)
        }

        #p3 [data-t="n"] {
            text-shadow: 0 0 28px rgba(232, 207, 143, .35), 0 2px 16px rgba(0, 0, 0, .4);
            letter-spacing: .02em
        }

        .ay {
            max-width: 30em;
            margin-inline: auto
        }

        /* فواصل زخرفية رفيعة */
        [data-t="ref"]::before,
        #p3 [data-t="d"]::before {
            content: "";
            display: block;
            width: 120px;
            height: 1px;
            margin: 0 auto 14px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
            opacity: .7
        }

        #p3 [data-t="d"]::before {
            margin-bottom: 18px
        }

        /* الأزرار الزجاجية */
        .btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255, 255, 255, .24), rgba(255, 255, 255, .06));
            border-color: color-mix(in srgb, currentColor 65%, transparent);
            box-shadow: 0 8px 22px -10px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .38);
            transition: transform .25s ease, box-shadow .25s ease, background .25s ease
        }

        .btn::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .35) 50%, transparent 65%);
            transform: translateX(-120%);
            transition: transform .7s ease
        }

        @media(hover:hover) {
            .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 26px -10px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .5)
            }

            .btn:hover::after {
                transform: translateX(120%)
            }
        }

        .btn:active {
            transform: scale(.96)
        }

        #pq .btn {
            transition: left .28s ease, top .28s ease, transform .25s ease, box-shadow .25s ease;
            background: linear-gradient(135deg, rgba(255, 255, 255, .8), rgba(255, 255, 255, .5))
        }

        /* صفحة الصندوق: شريط الاسم والمنزلقات كأقراص زجاجية */
        #bname {
            padding: 7px 18px;

        #ed textarea:focus-visible,
        #ed button:focus-visible,
